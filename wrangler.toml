# Cloudflare Worker — OmniToolify (SPA + API)
#
# Serves the Vite build from ./dist via Workers Static Assets with SPA
# fallback, and routes /api/* to the Worker script (currently only /api/health;
# future security endpoints will live here too).
name = "omnitoolify"
main = "src/worker.ts"
compatibility_date = "2026-11-06"

# Vite output. `not_found_handling = "single-page-application"` makes clean
# routes like /tools/word-counter fall back to index.html.
# `run_worker_first = ["/api/*"]` ensures API requests hit the Worker before
# asset matching, so unknown API routes return JSON 404 instead of the SPA.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Public build vars for the frontend (baked by Vite at build time).
# Required by `npm run build`; set in the build environment (GitHub Actions or
# Cloudflare Git integration), NOT committed.
[vars]
# VITE_FIREBASE_* are read from the environment by Vite during `npm run build`
# and are NOT passed as Worker runtime vars. The frontend config is part of the
# static bundle, not this Worker.
